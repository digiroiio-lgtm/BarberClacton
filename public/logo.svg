<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <!-- Barber pole icon -->
  <rect x="0" y="8" width="14" height="32" rx="3" fill="#18181b"/>
  <rect x="2" y="8" width="10" height="32" rx="2" fill="#f4f4f5"/>
  <rect x="2" y="8" width="10" height="10" rx="1" fill="#ef4444"/>
  <rect x="2" y="21" width="10" height="8" rx="0" fill="#ef4444"/>
  <rect x="2" y="32" width="10" height="8" rx="1" fill="#ef4444"/>
  <!-- Scissors icon -->
  <g transform="translate(20, 10)" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round">
    <circle cx="5" cy="5" r="3.5"/>
    <circle cx="5" cy="22" r="3.5"/>
    <line x1="7.5" y1="7" x2="14" y2="13.5"/>
    <line x1="7.5" y1="20" x2="14" y2="13.5"/>
  </g>
  <!-- Shop name -->
  <text x="44" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">TURKISH BARBER</text>
  <text x="44" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#f59e0b" letter-spacing="1.5">CLACTON</text>
</svg>
